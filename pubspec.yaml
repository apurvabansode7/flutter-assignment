name: test_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  intl: ^0.20.3
  google_fonts: ^9.0.0
  skeletonizer: ^3.0.0
  device_preview_plus: ^2.9.1
  shimmer: ^4.0.0
  flutter_svg: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/

  fonts:
    - family: Satoshi
      fonts:
        - asset: lib/assets/fonts/Satoshi-Regular.otf
          weight: 400
        - asset: lib/assets/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: lib/assets/fonts/Satoshi-Bold.otf
          weight: 700
    - family: Geist
      fonts:
        - asset: lib/assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/Geist-SemiBold.ttf
          weight: 600
